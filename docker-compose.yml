name: smart-bodim-finder
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smart_bodim_finder}
      MYSQL_USER: ${MYSQL_USER:-smart_bodim}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-smart-bodim-local-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-smart-bodim-root-local-password}
    ports: ["3307:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  ai-service:
    build:
      context: ./ai-service
      args: { AI_REQUIREMENTS: requirements-fixture.txt }
    restart: unless-stopped
    environment:
      AI_PROFILE: ${AI_PROFILE:-fixture}
      AI_INTERNAL_SECRET: ${AI_INTERNAL_SECRET:-local-ai-secret-change-before-deployment}
      AI_PORT: 5100
      AI_HOST: 0.0.0.0
      INDEX_DIR: /artifacts/index
    volumes: ["ai_artifacts:/artifacts"]
    expose: ["5100"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5100/health')"]
      interval: 10s
      timeout: 4s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment: &backend-environment
      APP_NAME: BodimBuddy.lk
      APP_ENV: local
      APP_KEY: ${APP_KEY:-base64:MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:8080
      SANCTUM_STATEFUL_DOMAINS: localhost:8080,127.0.0.1:8080,localhost:8000,127.0.0.1:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-smart_bodim_finder}
      DB_USERNAME: ${MYSQL_USER:-smart_bodim}
      DB_PASSWORD: ${MYSQL_PASSWORD:-smart-bodim-local-password}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: public
      AI_SERVICE_URL: http://ai-service:5100
      AI_INTERNAL_SECRET: ${AI_INTERNAL_SECRET:-local-ai-secret-change-before-deployment}
      AI_TIMEOUT_SECONDS: 2.5
      LOG_CHANNEL: stderr
    ports: ["8000:8000"]
    volumes: ["uploads:/app/storage/app/public"]
    depends_on:
      mysql: { condition: service_healthy }
      ai-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/api/v1/health') ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 15

  queue:
    build: ./backend
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--sleep=2", "--tries=3", "--timeout=90"]
    environment: *backend-environment
    volumes: ["uploads:/app/storage/app/public"]
    depends_on:
      backend: { condition: service_healthy }

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports: ["8080:80"]
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 4s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    profiles: ["mail"]
    ports: ["8025:8025", "1025:1025"]

volumes:
  mysql_data:
  uploads:
  ai_artifacts:
